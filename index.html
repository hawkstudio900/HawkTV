<!DOCTYPE html>
<html>
<head>
<style>

body {
    margin: 0;
    background: black;
    color: red;
    font-family: Arial;
}

/* HEADER */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid #330000;
}

.logo {
    height: 40px;
}

/* SEARCH */
.search {
    width: 250px;
    padding: 8px;
    background: #111;
    border: 1px solid red;
    color: red;
    outline: none;
}

/* BUTTON */
button {
    background: black;
    color: red;
    border: 1px solid red;
    padding: 8px 12px;
    cursor: pointer;
}

/* PLAYER */
.player-container {
    display: flex;
    justify-content: center;
    margin: 20px;
}

video#player {
    width: 80%;
    max-width: 900px;
    aspect-ratio: 16 / 9;
    background: black;
    border-radius: 10px;
}

/* LIBRARY */
#lib {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding: 10px;
}

.card {
    width: 200px;
    cursor: pointer;
    border: 1px solid #330000;
    padding: 5px;
}

.card video {
    width: 100%;
    height: 110px;
    object-fit: cover;
}

.title {
    text-align: center;
    font-size: 12px;
    margin-top: 5px;
}

/* HIDE FILE INPUT */
#fileInput {
    display: none;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <img id="logo" class="logo" src="logo.png">

    <input id="search" class="search" placeholder="Search videos...">

    <button onclick="document.getElementById('fileInput').click()">
        Add Videos
    </button>

</div>

<input type="file" id="fileInput" accept="video/*" multiple>

<!-- PLAYER -->
<div class="player-container">
    <video id="player" controls></video>
</div>

<!-- LIBRARY -->
<div id="lib"></div>

<script>

/////////////////////////////////////////////////////
// STATE
/////////////////////////////////////////////////////

let db;

let jsonVideos = [];
let localVideos = [];
let videos = [];

let searchValue = "";

/////////////////////////////////////////////////////
// LOGO
/////////////////////////////////////////////////////

document.getElementById("logo").src = "logo.png";

/////////////////////////////////////////////////////
// OPEN DB
/////////////////////////////////////////////////////

const request = indexedDB.open("videoDB", 1);

request.onupgradeneeded = function(e) {
    db = e.target.result;

    if (!db.objectStoreNames.contains("videos")) {
        db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
    }
};

request.onsuccess = function(e) {
    db = e.target.result;
    init();
};

/////////////////////////////////////////////////////
// LOAD JSON
/////////////////////////////////////////////////////

async function loadJSON() {
    try {
        const res = await fetch("videos.json");
        jsonVideos = await res.json();
    } catch {
        jsonVideos = [];
    }
}

/////////////////////////////////////////////////////
// LOAD LOCAL DB
/////////////////////////////////////////////////////

function loadDB() {

    return new Promise((resolve) => {

        const tx = db.transaction("videos", "readonly");
        const store = tx.objectStore("videos");

        const req = store.getAll();

        req.onsuccess = function() {

            localVideos = req.result.map(v => ({
                name: v.name,
                file: v.file,
                url: URL.createObjectURL(v.file),
                source: "local"
            }));

            resolve();
        };
    });
}

/////////////////////////////////////////////////////
// SAVE VIDEO
/////////////////////////////////////////////////////

function saveVideo(file) {

    const tx = db.transaction("videos", "readwrite");
    const store = tx.objectStore("videos");

    store.add({
        name: file.name,
        file: file
    });

    tx.oncomplete = init;
}

/////////////////////////////////////////////////////
// COMBINE
/////////////////////////////////////////////////////

function combine() {

    videos = [

        // JSON library
        ...jsonVideos.map(v => ({
            name: v.title,
            url: v.src,
            source: "json"
        })),

        // local uploads
        ...localVideos
    ];
}

/////////////////////////////////////////////////////
// PLAY
/////////////////////////////////////////////////////

function playVideo(url) {
    const player = document.getElementById("player");
    player.src = url;
    player.play();
}

/////////////////////////////////////////////////////
// RENDER
/////////////////////////////////////////////////////

function render() {

    const lib = document.getElementById("lib");
    lib.innerHTML = "";

    videos
    .filter(v => v.name.toLowerCase().includes(searchValue.toLowerCase()))
    .forEach(v => {

        lib.innerHTML += `
            <div class="card" onclick="playVideo('${v.url}')">
                <video src="${v.url}"></video>
                <div class="title">${v.name}</div>
            </div>
        `;
    });
}

/////////////////////////////////////////////////////
// INIT SYSTEM
/////////////////////////////////////////////////////

async function init() {

    await loadJSON();
    await loadDB();

    combine();
    render();
}

/////////////////////////////////////////////////////
// SEARCH
/////////////////////////////////////////////////////

document.getElementById("search").addEventListener("input", e => {
    searchValue = e.target.value;
    render();
});

/////////////////////////////////////////////////////
// FILE INPUT
/////////////////////////////////////////////////////

document.getElementById("fileInput").addEventListener("change", e => {

    for (let file of e.target.files) {
        saveVideo(file);
    }
});

</script>

</body>
</html>
